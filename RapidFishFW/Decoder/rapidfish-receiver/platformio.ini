; ============================================================
; Heltec Wireless Tracker Stick (ESP32-S3 + SX1262 + integrated GPS)
; ============================================================
[env:heltec_wireless_tracker_stick]
platform = espressif32
board = heltec_wifi_lora_32_V3
framework = arduino
board_build.f_cpu = 240000000L
build_flags =
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
monitor_speed = 921600

; ============================================================
; TTGO T3 LoRa32 v1.6.1 (ESP32 + SX1276, no integrated GPS)
; ============================================================
[env:ttgo_t3_lora32]
platform = espressif32
board = ttgo-lora32-v1
framework = arduino
monitor_speed = 115200
build_flags =
    -D BOARD_TTGO_T3=1
    -D SERIAL_BAUD=115200

; Shared library dependencies for all boards.
;
; To produce the single websafe `merged-firmware.bin` for web flashers, run the
; merge script explicitly after a build (it is intentionally NOT auto-wired
; into `platformio run`: neither PlatformIO's SCons post-action hooks nor
; PIOBUILDFILES reliably fire here, and one PIOBUILDFILES variant even broke the
; link step). Example:
;   platformio run -e <env>
;   python scripts\merge_bin.py <build_dir> <chip>
;   (or use esptool merge_bin manually - see scripts/merge_bin.py)
[env]
lib_deps =
    jgromes/RadioLib@^7.7.1
    mikalhart/TinyGPSPlus@^1.1.0