[env:rpipico2]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = rpipico2
framework = arduino
board_build.core = earlephilhower
monitor_speed = 921600
build_unflags = -Os
build_flags =
	-O3
	-funroll-loops
    -ffast-math
	-I.pio/build/rpipico2/pioasm
	-DFLASH2_DEBUG_TRACE=1
	# Bring-up trace: add -DFLASH2_DEBUG_TRACE=1 here (or pass
	# --build-flags -DFLASH2_DEBUG_TRACE=1 on the pio run CLI) for the
	# one-shot hardware trace; default OFF for production/commit.